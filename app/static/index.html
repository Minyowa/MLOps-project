<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkGuard 링크 검사</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #646a73; --line: #e2e5ea; --accent: #16181d;
    --safe: #1d7a4c; --safe-bg: #e5f4ec; --warn: #8a5a00; --warn-bg: #fbf0d6; --danger: #b42318; --danger-bg: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e24; --ink: #eceef2; --muted: #9aa1ab; --line: #2d323b; --accent: #eceef2;
      --safe: #5ccf95; --safe-bg: #15301f; --warn: #e9b44c; --warn-bg: #352a12; --danger: #f2877c; --danger-bg: #3a1917;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 6px 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 13px 14px; font: inherit; font-family: ui-monospace, Menlo, monospace; font-size: 14px;
                     color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  select { font: inherit; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .result { display: none; border-width: 2px; }
  .result.safe { border-color: var(--safe); } .result.warn { border-color: var(--warn); } .result.danger { border-color: var(--danger); }
  .verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .badge { font-weight: 800; font-size: 20px; padding: 4px 14px; border-radius: 8px; }
  .safe .badge { color: var(--safe); background: var(--safe-bg); }
  .warn .badge { color: var(--warn); background: var(--warn-bg); }
  .danger .badge { color: var(--danger); background: var(--danger-bg); }
  .host { font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); word-break: break-all; }
  .advice { margin: 12px 0 0; font-weight: 600; }
  .bar { position: relative; height: 8px; border-radius: 999px; background: var(--line); margin: 14px 0 4px; overflow: hidden; }
  .bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .safe .bar > span { background: var(--safe); } .warn .bar > span { background: var(--warn); } .danger .bar > span { background: var(--danger); }
  .bar-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  ul.reasons { margin: 12px 0 0; padding-left: 18px; color: var(--ink); }
  ul.reasons li { margin: 2px 0; }
  .fb { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
  .fb p { margin: 0; font-weight: 600; } .fb small { color: var(--muted); }
  .fb-done { color: var(--muted); margin-top: 10px; display: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  td.mono { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .err { color: var(--danger); margin-top: 10px; display: none; }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  @media (max-width: 520px) { .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <h1>받은 링크, 열기 전에 검사하세요</h1>
  <p class="sub">문자·메신저·메일로 받은 링크를 붙여 넣으면 피싱(스미싱) 위험도를 알려 드려요. 링크는 열지 않고 주소 모양만 분석합니다.</p>

  <section class="panel">
    <label class="small" for="url">링크 주소</label>
    <input type="text" id="url" placeholder="예: https://cjlogistics-delivery.top/kr" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
    <div class="row">
      <select id="channel" aria-label="받은 경로">
        <option value="sms">문자(SMS)</option>
        <option value="messenger">메신저</option>
        <option value="email">이메일</option>
        <option value="web">웹사이트</option>
        <option value="other">기타</option>
      </select>
      <button class="primary" id="check">검사하기</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="panel result" id="result">
    <div class="verdict">
      <span class="badge" id="badge"></span>
      <span class="host" id="host"></span>
    </div>
    <div class="bar"><span id="barfill"></span></div>
    <div class="bar-legend"><span>안전</span><span id="risktxt"></span><span>위험</span></div>
    <p class="advice" id="advice"></p>
    <ul class="reasons" id="reasons"></ul>
    <div class="fb">
      <p>이 링크, 실제로는 어땠나요?</p>
      <small>알려 주시면 판정 정확도를 높이는 데 쓰여요. 나중에 확인되면 그때 눌러도 돼요.</small>
      <div class="row" id="fbrow">
        <button id="fb-scam">사기였어요</button>
        <button id="fb-safe">안전했어요</button>
      </div>
      <div class="fb-done" id="fbdone"></div>
    </div>
  </section>

  <section class="panel">
    <h2>지금까지 검사 현황</h2>
    <div class="stats">
      <div class="stat"><b id="s-checks">–</b><span>검사한 링크</span></div>
      <div class="stat"><b id="s-fb">–</b><span>결과를 알려 준 링크</span></div>
      <div class="stat"><b id="s-acc">–</b><span>실제 정확도</span></div>
    </div>
  </section>

  <section class="panel">
    <h2>내 검사 기록</h2>
    <div id="history"><p class="empty">아직 검사한 링크가 없어요.</p></div>
    <p class="meta" id="model" style="margin-top:12px"></p>
  </section>
</main>

<script>
const SAMPLES = [
  "https://cjlogistics-delivery.top/kr",
  "http://bsqzqdqykm.duckdns.org/?vjhgb",
  "https://www.coupang.com/vp/products/123456",
  "https://www.hometax.go.kr",
  "http://192.168.10.5/login/verify.php",
];
const ADVICE = {
  "안전": "특별히 위험한 특징은 보이지 않아요. 그래도 개인정보·결제 요구는 한 번 더 확인하세요.",
  "주의": "확신하기 어려워요. 링크를 열기보다 공식 앱이나 직접 검색으로 접속하세요.",
  "위험": "피싱일 가능성이 높아요. 링크를 열지 말고, 개인정보·인증번호를 입력하지 마세요.",
};
const CLS = { "안전": "safe", "주의": "warn", "위험": "danger" };
const $ = (id) => document.getElementById(id);
let current = null;
const history = [];

SAMPLES.forEach((s) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s;
  b.onclick = () => { $("url").value = s; $("url").focus(); };
  $("chips").appendChild(b);
});

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? "링크를 다시 확인해 주세요." : "요청 실패 (" + res.status + ")");
  }
  return data;
}
function showError(msg) { $("err").textContent = msg; $("err").style.display = msg ? "block" : "none"; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function check() {
  const url = $("url").value.trim();
  if (!url) { showError("링크를 붙여 넣어 주세요."); return; }
  showError(""); $("check").disabled = true;
  try {
    const r = await api("/v1/check", { url, channel: $("channel").value });
    current = r;
    $("result").className = "panel result " + CLS[r.verdict];
    $("result").style.display = "block";
    $("badge").textContent = r.verdict;
    $("host").textContent = r.host;
    $("barfill").style.width = Math.max(3, r.risk * 100) + "%";
    $("risktxt").textContent = "위험도 " + Math.round(r.risk * 100) + "%";
    $("advice").textContent = ADVICE[r.verdict];
    $("reasons").innerHTML = r.reasons.length ? r.reasons.map((x) => "<li>" + esc(x) + "</li>").join("")
                                               : "<li>눈에 띄는 위험 신호는 없어요</li>";
    $("fbrow").style.display = "flex"; $("fbdone").style.display = "none";
    $("fb-scam").disabled = $("fb-safe").disabled = false;
    history.unshift({ id: r.check_id, url, verdict: r.verdict, risk: r.risk, truth: "–" });
    renderHistory(); refreshStats();
  } catch (e) { showError(e.message); }
  finally { $("check").disabled = false; }
}

async function report(trueLabel) {
  if (!current) return;
  $("fb-scam").disabled = $("fb-safe").disabled = true;
  try {
    const r = await api("/v1/feedback", { check_id: current.check_id, true_label: trueLabel });
    $("fbrow").style.display = "none"; $("fbdone").style.display = "block";
    $("fbdone").textContent = (trueLabel ? "사기였다고" : "안전했다고") + " 기록했어요. " +
      (r.is_correct ? "판정이 맞았네요." : "판정이 틀렸어요 — 다음 학습에 반영할게요.");
    const h = history.find((x) => x.id === current.check_id);
    if (h) h.truth = trueLabel ? "사기" : "안전";
    renderHistory(); refreshStats();
  } catch (e) { showError(e.message); $("fb-scam").disabled = $("fb-safe").disabled = false; }
}

function renderHistory() {
  if (!history.length) return;
  $("history").innerHTML = "<table><thead><tr><th>링크</th><th>판정</th><th>위험도</th><th>실제</th></tr></thead><tbody>" +
    history.slice(0, 20).map((h) => "<tr><td class='mono'>" + esc(h.url) + "</td><td>" + h.verdict + "</td><td>" +
      Math.round(h.risk * 100) + "%</td><td>" + h.truth + "</td></tr>").join("") + "</tbody></table>";
}

async function refreshStats() {
  try {
    const s = await api("/v1/stats");
    $("s-checks").textContent = s.checks; $("s-fb").textContent = s.feedback;
    $("s-acc").textContent = s.live_accuracy == null ? "–" : (s.live_accuracy * 100).toFixed(1) + "%";
  } catch (e) { /* 통계 실패는 화면을 막지 않음 */ }
}

$("check").onclick = check;
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
$("fb-scam").onclick = () => report(1);
$("fb-safe").onclick = () => report(0);
api("/health").then((h) => { $("model").textContent = "model " + h.model_version + " · logs: " + h.log_sinks.join(", "); })
  .catch(() => { $("model").textContent = "API 연결 실패"; });
refreshStats();
</script>
</body>
</html>
